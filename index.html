<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😈</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="IMPOSTER - لعبة الشلة الأولى في مصر على موبايل واحد. مين فيكم مش عارف ومين فيكم بيهبد؟" />
    <title>IMPOSTER | إمبوستر - مين فيكم بيهبد؟</title>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="padding:30px 20px;color:#F4F0E8;text-align:center;font-family:sans-serif;max-width:400px;margin:50px auto;background:rgba(42, 16, 46, 0.95);border-radius:20px;border:1px solid #D92772;"><h2 style="color:#E5B91A;font-size:18px;margin-bottom:10px;">حدث خطأ أثناء تحميل اللعبة</h2><p style="font-size:13px;color:#fff;word-break:break-all;margin-bottom:15px;">' + (e.message || e) + '</p><p style="font-size:11px;color:#aaa;margin-bottom:20px;">' + (e.filename || '') + (e.lineno ? (':' + e.lineno) : '') + '</p><button onclick="localStorage.clear();window.location.reload();" style="padding:10px 20px;background:#D92772;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">إعادة المحاولة</button></div>';
        }
      });
    </script>
  </head>
  <body class="bg-[#120A12] text-[#F4F0E8]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
